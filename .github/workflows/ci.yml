name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-${{ runner.os }}-

      # pub's example convention resolves ./example, whose dep path only a local ClojureDart compile creates
      - name: Stub the example's vendored library dep
        run: |
          dep=$(sed -n 's|^ *path: \(\.clojuredart/deps/.*\)|\1|p' example/pubspec.yaml)
          mkdir -p "example/$dep"
          cp pubspec.yaml "example/$dep/pubspec.yaml"

      - name: Run tests
        run: clojure -M:cljd test
